<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Colorful gym illustration with a dumbbell and kettlebells" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E0B36"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FFB84D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="500" cy="70" r="120" fill="#fff" opacity="0.07"/>
  <circle cx="70" cy="330" r="150" fill="#fff" opacity="0.06"/>
  <circle cx="300" cy="190" r="140" fill="#fff" opacity="0.08"/>

  <!-- Dumbbell -->
  <g transform="translate(300 175) rotate(-14)">
    <rect x="-150" y="-9" width="300" height="18" rx="9" fill="#E9E1F7"/>
    <rect x="-60" y="-13" width="120" height="26" rx="7" fill="#1E0B36"/>
    <g stroke="#6D28D9" stroke-width="3" stroke-linecap="round">
      <path d="M-40 -9v18M-26 -9v18M-12 -9v18M2 -9v18M16 -9v18M30 -9v18"/>
    </g>
    <rect x="-122" y="-72" width="34" height="144" rx="13" fill="url(#gold)"/>
    <rect x="88" y="-72" width="34" height="144" rx="13" fill="url(#gold)"/>
    <rect x="-160" y="-52" width="30" height="104" rx="11" fill="#1E0B36"/>
    <rect x="130" y="-52" width="30" height="104" rx="11" fill="#1E0B36"/>
    <rect x="-155" y="-44" width="6" height="60" rx="3" fill="#F472B6" opacity="0.8"/>
    <rect x="135" y="-44" width="6" height="60" rx="3" fill="#F472B6" opacity="0.8"/>
  </g>

  <!-- Kettlebell (gold) -->
  <g transform="translate(105 300)">
    <path d="M-28 -34 C-28 -92 28 -92 28 -34" fill="none" stroke="#FFB84D" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="46" fill="url(#gold)"/>
    <ellipse cx="-16" cy="-14" rx="10" ry="16" fill="#fff" opacity="0.35" transform="rotate(25 -16 -14)"/>
    <rect x="-18" y="8" width="36" height="10" rx="5" fill="#1E0B36" opacity="0.25"/>
  </g>

  <!-- Kettlebell (white) -->
  <g transform="translate(500 312) scale(0.8)">
    <path d="M-28 -34 C-28 -92 28 -92 28 -34" fill="none" stroke="#F8F5FF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="46" fill="#F8F5FF"/>
    <ellipse cx="-16" cy="-14" rx="10" ry="16" fill="#F472B6" opacity="0.35" transform="rotate(25 -16 -14)"/>
    <rect x="-18" y="8" width="36" height="10" rx="5" fill="#6D28D9" opacity="0.25"/>
  </g>

  <!-- Heartbeat line -->
  <path d="M30 372 H200 L218 340 L244 398 L268 346 L282 372 H570" fill="none" stroke="#fff"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Sparkles -->
  <g fill="#FFD27A">
    <path transform="translate(70 80)" d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4Z"/>
    <path transform="translate(520 150) scale(0.8)" d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4Z"/>
    <path transform="translate(180 40) scale(0.6)" d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4Z"/>
  </g>
  <g fill="#fff" opacity="0.9">
    <circle cx="430" cy="55" r="4"/>
    <circle cx="40" cy="200" r="3"/>
    <circle cx="560" cy="250" r="3.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
